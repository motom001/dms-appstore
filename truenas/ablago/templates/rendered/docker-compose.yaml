configs:
  permissions_actions_data:
    content: '[{"read_only": false, "mount_path": "/mnt/permission/postgres_postgres_data",
      "is_temporary": false, "identifier": "postgres_postgres_data", "recursive":
      false, "mode": "check", "uid": 999, "gid": 999, "chmod": null}, {"read_only":
      false, "mount_path": "/mnt/permission/files", "is_temporary": false, "identifier":
      "files", "recursive": false, "mode": "check", "uid": 568, "gid": 568, "chmod":
      null}, {"read_only": false, "mount_path": "/mnt/permission/key_store", "is_temporary":
      false, "identifier": "key_store", "recursive": false, "mode": "check", "uid":
      568, "gid": 568, "chmod": null}, {"read_only": false, "mount_path": "/mnt/permission/backups",
      "is_temporary": false, "identifier": "backups", "recursive": false, "mode":
      "check", "uid": 568, "gid": 568, "chmod": null}]'
networks:
  ix-internal-app-name-ablago-net:
    enable_ipv6: false
    external: false
    labels:
      tn.network.internal: 'true'
    name: ix-internal-app-name-ablago-net
services:
  ablago:
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cap_drop:
    - ALL
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    environment:
      DATABASE_URL: postgres://dms:password@postgres:5432/dms?sslmode=disable
      DMS_DATENWURZEL: /data
      DMS_DATEN_WURZEL: /data
      DMS_EINRICHTUNGSCODE: aus
      GID: '568'
      GROUP_ID: '568'
      NVIDIA_VISIBLE_DEVICES: void
      PGID: '568'
      PORT: '8080'
      PUID: '568'
      TZ: Etc/UTC
      UID: '568'
      UMASK: '002'
      UMASK_SET: '002'
      USER_ID: '568'
    group_add:
    - 568
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:8080/api/gesundheit
      timeout: 5s
    image: ghcr.io/motom001/dms:0.299.2@sha256:877b3946feaea773fead81865c95b8b3e92469ff0f3f7deff9464fc946cd3e95
    networks:
      ix-internal-app-name-ablago-net: {}
    platform: linux/amd64
    ports:
    - mode: ingress
      protocol: tcp
      published: 8080
      target: 8080
    privileged: false
    restart: unless-stopped
    security_opt:
    - no-new-privileges=true
    stdin_open: false
    tty: false
    user: 0:0
    volumes:
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/files
      target: /data/files
      type: bind
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/keys
      target: /data/geheim
      type: bind
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/backups
      target: /data/sicherung
      type: bind
  permissions:
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    cap_drop:
    - ALL
    configs:
    - mode: 320
      source: permissions_actions_data
      target: /script/actions.json
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
    entrypoint:
    - python3
    - /script/permissions.py
    environment:
      GID: '568'
      GROUP_ID: '568'
      NVIDIA_VISIBLE_DEVICES: void
      PGID: '568'
      PUID: '568'
      TZ: Etc/UTC
      UID: '568'
      UMASK: '002'
      UMASK_SET: '002'
      USER_ID: '568'
    group_add:
    - 568
    healthcheck:
      disable: true
    image: ghcr.io/truenas/containers/container-utils:1.1.2@sha256:6ddfdc314af9d18cfacb836ad266ef0ed91fecaa3686b20be72e464972860c08
    network_mode: none
    platform: linux/amd64
    privileged: false
    restart: on-failure:1
    security_opt:
    - no-new-privileges=true
    stdin_open: false
    tty: false
    user: 0:0
    volumes:
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/backups
      target: /mnt/permission/backups
      type: bind
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/files
      target: /mnt/permission/files
      type: bind
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/keys
      target: /mnt/permission/key_store
      type: bind
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/postgres_data
      target: /mnt/permission/postgres_postgres_data
      type: bind
  postgres:
    cap_drop:
    - ALL
    command:
    - -c
    - max_connections=100
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres_upgrade:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    environment:
      GID: '568'
      GROUP_ID: '568'
      NVIDIA_VISIBLE_DEVICES: void
      PGDATA: /var/lib/postgresql/18/docker
      PGID: '568'
      PGPORT: '5432'
      POSTGRES_DB: dms
      POSTGRES_PASSWORD: password
      POSTGRES_USER: dms
      PUID: '568'
      TZ: Etc/UTC
      UID: '568'
      UMASK: '002'
      UMASK_SET: '002'
      USER_ID: '568'
    group_add:
    - 568
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
      - CMD
      - /usr/lib/postgresql/18/bin/pg_isready
      - -h
      - 127.0.0.1
      - -p
      - '5432'
      - -U
      - dms
      - -d
      - dms
      timeout: 5s
    image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    networks:
      ix-internal-app-name-ablago-net: {}
    platform: linux/amd64
    privileged: false
    restart: unless-stopped
    security_opt:
    - no-new-privileges=true
    shm_size: 256M
    stdin_open: false
    stop_grace_period: 60s
    tty: false
    user: 999:999
    volumes:
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/postgres_data
      target: /var/lib/postgresql
      type: bind
  postgres_upgrade:
    cap_drop:
    - ALL
    depends_on:
      permissions:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
    entrypoint:
    - /bin/bash
    - -c
    - /upgrade.sh
    environment:
      GID: '568'
      GROUP_ID: '568'
      NVIDIA_VISIBLE_DEVICES: void
      PGDATA: /var/lib/postgresql/18/docker
      PGID: '568'
      PGPORT: '5432'
      POSTGRES_DB: dms
      POSTGRES_PASSWORD: password
      POSTGRES_USER: dms
      PUID: '568'
      TARGET_VERSION: '18'
      TZ: Etc/UTC
      UID: '568'
      UMASK: '002'
      UMASK_SET: '002'
      USER_ID: '568'
    group_add:
    - 568
    healthcheck:
      disable: true
    image: ghcr.io/truenas/containers/postgres-upgrade:1.2.27@sha256:0a089b0f18f773f7a0dc471fc2448be444006ef7a453f89907626a8002362ca2
    network_mode: none
    platform: linux/amd64
    privileged: false
    restart: on-failure:1
    security_opt:
    - no-new-privileges=true
    stdin_open: false
    tty: false
    user: 999:999
    volumes:
    - bind:
        create_host_path: true
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/ablago/postgres_data
      target: /var/lib/postgresql
      type: bind
volumes: {}
x-action-required: false
