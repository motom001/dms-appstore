version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dms_server_1
      APP_PORT: 3000
      # Familienmitglieder melden sich mit ihrem eigenen Ablago-Konto an; die Umbrel-Anmeldung hat nur
      # der Besitzer des Geräts. Links aus E-Mails und die API (/api/v1) gehen ebenfalls ohne sie.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/motom001/dms:0.290.10@sha256:96a9f5710bd0eceea6dba59104893b4e807e1c1d26454b8905b4c6357aa17cfd
    restart: on-failure
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Die Verbindung steht fest; der Einrichtungsassistent beginnt beim Mandanten (#176).
      DATABASE_URL: postgres://dms:${APP_DMS_DB_PASSWORD}@dms_db_1:5432/dms
      # Ohne Einrichtungscode: Er stünde nur im Protokoll des Containers.
      DMS_EINRICHTUNGSCODE: "aus"
    volumes:
      - ${APP_DATA_DIR}/data/files:/data/files
      - ${APP_DATA_DIR}/data/geheim:/data/geheim
      - ${APP_DATA_DIR}/data/sicherung:/data/sicherung

  db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: on-failure
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${APP_DMS_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10
