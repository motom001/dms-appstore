name: dms

services:
  # dms-komplett (motom001/dms-appstore#5): DMS und PostgreSQL in einem Container. PostgreSQL lauscht
  # nur im Container, ohne Passwort – es gibt kein festes Datenbank-Passwort und keinen Datenbank-Port.
  dms:
    image: {{DMS_KOMPLETT_IMAGE}}
    restart: unless-stopped
    environment:
      # Ohne Einrichtungscode: Er stünde nur im Protokoll des Containers.
      DMS_EINRICHTUNGSCODE: "aus"
    ports:
      - target: 3000
        published: "8478"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/files
        target: /data/files
      - type: bind
        source: /DATA/AppData/$AppID/geheim
        target: /data/geheim
      - type: bind
        source: /DATA/AppData/$AppID/sicherung
        target: /data/sicherung
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /data/postgres

x-casaos:
  id: io.github.motom001.dms
  main: dms
  index: /
  port_map: "8478"
  scheme: http
  icon: {{ICON}}
  title:
    en_US: DMS
    de_DE: DMS
  tagline:
    en_US: Documents, contracts and paperwork of your household – organised in folders
    de_DE: Verträge, Versicherungen, Steuer und alle Unterlagen deines Haushalts – geordnet in Mappen
  description:
    en_US: |
      DMS is a self-hosted document management system for households and families. Contracts, insurance, tax, car, house, medical bills: every topic gets a folder with the fields you need, documents are searchable thanks to built-in text recognition, and reminders make sure no deadline is missed.

      After installing, open the app: a setup assistant asks for the name of your household and creates the first administrator. The database is already connected. The user interface is in German.

      - Folders with your own fields, registers and views
      - Full-text search, also in scanned PDFs (OCR)
      - Tasks, reminders, notes and a daily summary by e-mail
      - Several users with roles and permissions
      - Encrypted backups with an emergency sheet, restore in the browser
    de_DE: |
      DMS ist ein selbst gehostetes Dokumentenmanagement für Haushalte und Familien. Verträge, Versicherungen, Steuer, Auto, Haus, Arztrechnungen: Jedes Thema bekommt eine Mappe mit den Feldern, die du brauchst. Dank eingebauter Texterkennung findest du jedes Dokument wieder, und Erinnerungen sorgen dafür, dass keine Frist verstreicht.

      Nach der Installation öffnest du die App: Ein Assistent fragt nach dem Namen deines Haushalts und legt den ersten Administrator an. Die Datenbank ist schon angebunden.

      - Mappen mit eigenen Feldern, Registern und Sichten
      - Volltextsuche, auch in eingescannten PDFs (Texterkennung)
      - Aufgaben, Erinnerungen, Notizen und eine tägliche Zusammenfassung per E-Mail
      - Mehrere Benutzer mit Rollen und Rechten
      - Verschlüsselte Sicherungen mit Notfallblatt, Wiederherstellen im Browser
  tips:
    before_install:
      en_US: Open the app right after installing and finish the setup assistant – until then everyone in your home network could do it. Afterwards, create a backup schedule under Werkbank → Sicherung and copy the backups to another place from time to time.
      de_DE: Öffne die App direkt nach der Installation und schließe den Einrichtungsassistenten ab – bis dahin könnte das jeder in deinem Heimnetz tun. Lege danach unter Werkbank → Sicherung einen Zeitplan an und kopiere die Sicherungen ab und zu an einen anderen Ort.
  author: motom001
  developer: motom001
  category: Productivity
  architectures:
    - amd64
    - arm64
  version: "{{VERSION}}"
  update_at: "{{DATUM}}"
  release_notes:
    en_US: "{{HINWEISE}}"
    de_DE: "{{HINWEISE_DE}}"
  website: https://motom001.github.io/dms/benutzer/aktuell/
  repo: https://github.com/motom001/dms
  support: https://github.com/motom001/dms/issues
  docs: https://motom001.github.io/dms/admin/aktuell/
  screenshot_link:
{{SCREENSHOTS}}
