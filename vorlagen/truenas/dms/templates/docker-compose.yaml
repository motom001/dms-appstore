{% set tpl = ix_lib.base.render.Render(values) %}

{% set dms_net = tpl.networks.create_internal("dms-net") %}

{% set c = tpl.add_container(values.consts.dms_container_name, "image") %}
{% do c.add_network(dms_net) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.dms.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.dms.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(dms_net) %}

{% do c.set_init(true) %}
{% do c.healthcheck.set_test("wget", {"port": 3000, "path": "/api/gesundheit", "busybox": true}) %}
{% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{# Datenbank vorbelegt: der Einrichtungsassistent beginnt beim Mandanten. #}
{% do c.environment.add_env("DATABASE_URL", postgres.get_url("postgres")) %}
{# App-Katalog: ohne Einrichtungscode (er stünde nur im Protokoll). #}
{% do c.environment.add_env("DMS_EINRICHTUNGSCODE", "aus") %}
{% do c.environment.add_user_envs(values.dms.additional_envs) %}

{% do c.add_port(values.network.web_port, {"container_port": 3000}) %}

{% do c.add_storage("/data/files", values.storage.files) %}
{% do c.add_storage("/data/geheim", values.storage.geheim) %}
{% do c.add_storage("/data/sicherung", values.storage.sicherung) %}

{% for store in values.storage.additional_storage %}
  {% do c.add_storage(store.mount_path, store) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
