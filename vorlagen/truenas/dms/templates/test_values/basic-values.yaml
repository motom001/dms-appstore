resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

dms:
  postgres_image_selector: postgres_17_image
  db_password: password
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  files: /opt/tests/mnt/dms/files
  geheim: /opt/tests/mnt/dms/geheim
  sicherung: /opt/tests/mnt/dms/sicherung
  postgres_data: /opt/tests/mnt/dms/postgres-data

storage:
  files:
    type: ix_volume
    ix_volume_config:
      dataset_name: files
      create_host_path: true
  geheim:
    type: ix_volume
    ix_volume_config:
      dataset_name: geheim
      create_host_path: true
  sicherung:
    type: ix_volume
    ix_volume_config:
      dataset_name: sicherung
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
