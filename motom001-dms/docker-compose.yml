version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: motom001-dms_server_1
      APP_PORT: 3000
      # Familienmitglieder melden sich mit ihrem eigenen Ablago-Konto an; die Umbrel-Anmeldung hat nur
      # der Besitzer des Geräts. Links aus E-Mails und die API (/api/v1) gehen ebenfalls ohne sie.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/motom001/dms:0.313.1@sha256:a7ef86faca8d6c2767dce85817b2509ded624c211017d9c7a507f0bde6c4adc4
    restart: on-failure
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Die Verbindung steht fest; der Einrichtungsassistent beginnt beim Mandanten (#176).
      DATABASE_URL: postgres://dms:${APP_MOTOM001_DMS_DB_PASSWORD}@motom001-dms_db_1:5432/dms
      # Ohne Einrichtungscode: Er stünde nur im Protokoll des Containers.
      DMS_EINRICHTUNGSCODE: "aus"
    volumes:
      - ${APP_DATA_DIR}/data/files:/data/files
      - ${APP_DATA_DIR}/data/geheim:/data/geheim
      - ${APP_DATA_DIR}/data/sicherung:/data/sicherung

  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: on-failure
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${APP_MOTOM001_DMS_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10
