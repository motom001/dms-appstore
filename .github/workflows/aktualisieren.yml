# Hält die App-Einträge auf dem Stand des neuesten DMS-Releases (motom001/dms#176).
#
# - Umbrel liest dieses Repository direkt (umbrel-app-store.yml, motom001-dms/).
# - ZimaOS (v2) liest den gebauten Store auf dem Branch gh-pages (über jsDelivr).
# - CasaOS (v1) liest die Zip-Datei des Branches main.
#
# Täglich, von Hand (auch für eine bestimmte Version) und nach Änderungen an Vorlagen oder Skript.
# Ohne zusätzliche Tokens: Releases und Images des DMS sind öffentlich.
name: Store aktualisieren

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'DMS-Version, z. B. 0.39.0 (leer = neuestes Release)'
        required: false
  push:
    branches: [main]
    paths: ['vorlagen/**', 'werkzeuge/**', '.github/workflows/**', 'store-config.json', 'supported-languages.json', 'Apps/DMS/icon.*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: DMS-Version bestimmen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          WUNSCH: ${{ inputs.version }}
        run: |
          v="$WUNSCH"
          [ -n "$v" ] || v=$(gh api repos/motom001/dms/releases/latest --jq .tag_name)
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Datum des Releases – damit sich die Einträge nicht täglich ändern.
          echo "datum=$(gh api "repos/motom001/dms/releases/tags/v$v" --jq '.published_at[0:10]')" >> "$GITHUB_OUTPUT"
          # Einrichtung ohne Code gibt es erst ab 0.39.0 (für die Probe-Installation).
          if [ "$(printf '%s\n' 0.39.0 "$v" | sort -V | head -1)" = 0.39.0 ]; then echo "probe=" >> "$GITHUB_OUTPUT"; else echo "probe=--ohne-einrichtung" >> "$GITHUB_OUTPUT"; fi
          echo "DMS $v"
          # Erst ab 0.42.0 (Einrichtung ohne Code, dms-komplett); im Pull Request trotzdem prüfen.
          if [ "$(printf '%s\n' 0.42.0 "$v" | sort -V | head -1)" = 0.42.0 ] || [ "${{ github.event_name }}" = pull_request ]; then
            echo "weiter=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DMS $v ist älter als 0.42.0 – noch nichts zu veröffentlichen."
          fi

      - name: Images mit Digest auflösen
        if: steps.v.outputs.weiter == 'true'
        id: bilder
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          digest() {
            local bild="$1"
            # Index für beide Plattformen – Umbrel und ZimaOS laufen auf amd64 und arm64.
            local roh; roh=$(docker buildx imagetools inspect "$bild" --raw)
            for p in amd64 arm64; do
              echo "$roh" | jq -e --arg p "$p" '.manifests[] | select(.platform.architecture == $p)' >/dev/null \
                || { echo "::error::$bild hat kein Image für $p"; exit 1; }
            done
            echo "$bild@$(docker buildx imagetools inspect "$bild" --format '{{json .Manifest}}' | jq -r .digest)"
          }
          echo "dms=$(digest "ghcr.io/motom001/dms:$V")" >> "$GITHUB_OUTPUT"
          # ZimaOS/CasaOS: DMS mit eingebauter Datenbank, ohne Datenbank-Passwort (dms-appstore#5).
          echo "komplett=$(digest "ghcr.io/motom001/dms-komplett:$V")" >> "$GITHUB_OUTPUT"
          # PostgreSQL 17 wie in der Compose-Vorlage des DMS; der Digest folgt den Patch-Versionen.
          echo "postgres=$(digest postgres:17-alpine)" >> "$GITHUB_OUTPUT"

      - name: Screenshots aus dem Handbuch holen
        if: steps.v.outputs.weiter == 'true'
        run: |
          hole() {
            for h in benutzer admin; do
              curl -fsSL -o "Apps/DMS/$2" "https://motom001.github.io/dms/$h/aktuell/bilder/$1.png" && return 0
            done
            echo "::warning::Screenshot $1 nicht gefunden – behalte den bisherigen"
          }
          hole ablage screenshot-1.png
          hole dokumente screenshot-2.png
          hole werkbank-sicherung screenshot-3.png
          ls -l Apps/DMS

      - name: App-Einträge erzeugen
        if: steps.v.outputs.weiter == 'true'
        env:
          # Im Pull Request nur prüfen – auch mit einem älteren Release.
          PRUEFLAUF: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: python3 werkzeuge/erzeugen.py "${{ steps.v.outputs.version }}" "${{ steps.bilder.outputs.dms }}" "${{ steps.bilder.outputs.postgres }}" "${{ steps.bilder.outputs.komplett }}" "${{ steps.v.outputs.datum }}"

      - name: Compose-Dateien prüfen
        if: steps.v.outputs.weiter == 'true'
        run: |
          # Umbrel setzt diese Werte zur Laufzeit; hier nur, damit die Syntax geprüft werden kann.
          # app_proxy hat bei Umbrel kein Image (umbrelOS ergänzt es) – für die Prüfung weglassen.
          python3 -c "import yaml,sys; d=yaml.safe_load(open('motom001-dms/docker-compose.yml')); d['services'].pop('app_proxy'); yaml.safe_dump(d, open('/tmp/umbrel.yml','w'))"
          APP_DATA_DIR=/tmp/app APP_MOTOM001_DMS_DB_PASSWORD=x docker compose -f /tmp/umbrel.yml config -q
          AppID=dms docker compose -f Apps/DMS/docker-compose.yml config -q

      - name: Probe-Installation Umbrel
        if: steps.v.outputs.weiter == 'true'
        run: werkzeuge/probe.sh umbrel ${{ steps.v.outputs.probe }}

      - name: Probe-Installation ZimaOS/CasaOS
        if: steps.v.outputs.weiter == 'true'
        run: werkzeuge/probe.sh casaos ${{ steps.v.outputs.probe }}

      # TrueNAS (motom001/dms#182): mit dem Prüfwerkzeug des Katalogs rendern, starten, auf „healthy“ warten.
      - name: TrueNAS-Katalog prüfen
        if: steps.v.outputs.weiter == 'true'
        run: |
          git clone --quiet --depth 1 https://github.com/truenas/apps.git "$RUNNER_TEMP/truenas-apps"
          rm -rf "$RUNNER_TEMP/truenas-apps/ix-dev/community/dms"
          cp -r truenas/dms "$RUNNER_TEMP/truenas-apps/ix-dev/community/dms"
          pip install --quiet pyyaml psutil pytest pytest-cov bcrypt pydantic
          cd "$RUNNER_TEMP/truenas-apps"
          # Neueste Bibliothek des Katalogs verwenden; ci.py trägt den Hash ein.
          lib=$(ls library | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          sed -i "s/^lib_version: .*/lib_version: $lib/" ix-dev/community/dms/app.yaml
          # Bei Fehlern die letzten Zeilen als Anmerkung ausgeben (Job-Logs sind nicht überall lesbar).
          melde() { tail -n 40 "$1" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=TrueNAS::/'; echo; }
          set -o pipefail
          ./.github/scripts/ci.py --app dms --train community --test-file basic-values.yaml 2>&1 | tee "$RUNNER_TEMP/truenas.log" || { melde "$RUNNER_TEMP/truenas.log"; exit 1; }
          ./.github/scripts/port_validation.py 2>&1 | tee "$RUNNER_TEMP/ports.log" || { melde "$RUNNER_TEMP/ports.log"; exit 1; }
          # Ergebnis (Bibliothek, Hash, Metadaten) zurück, damit es eingecheckt wird.
          rsync -a --delete ix-dev/community/dms/ "$GITHUB_WORKSPACE/truenas/dms/"

      - name: Übernehmen
        if: steps.v.outputs.weiter == 'true' && github.event_name != 'pull_request'
        run: |
          git add -A motom001-dms Apps truenas offiziell
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "DMS ${{ steps.v.outputs.version }}"
          git push

      - name: ZimaOS-Store bauen (v2)
        if: steps.v.outputs.weiter == 'true'
        uses: IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f # v1.1.3
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages

      - name: ZimaOS-Store veröffentlichen
        if: steps.v.outputs.weiter == 'true' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      # jsDelivr hält Branches bis zu 12 Stunden im Cache – nach einem Update gleich leeren.
      - name: Cache von jsDelivr leeren
        if: steps.v.outputs.weiter == 'true' && github.event_name != 'pull_request'
        run: |
          for p in "gh-pages/store.json" "gh-pages/index.json" "main/Apps/DMS/icon.png" "main/Apps/DMS/screenshot-1.png" "main/Apps/DMS/screenshot-2.png" "main/Apps/DMS/screenshot-3.png"; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@$p" >/dev/null || true
          done
