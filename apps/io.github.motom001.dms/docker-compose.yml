name: dms

services:
  # dms-komplett (motom001/dms-appstore#5): DMS und PostgreSQL in einem Container. PostgreSQL lauscht
  # nur im Container, ohne Passwort – es gibt kein festes Datenbank-Passwort und keinen Datenbank-Port.
  dms:
    image: ghcr.io/motom001/dms-komplett:0.138.0@sha256:1c1aecb108d0a90d674b980b6c021678b325fd651f634e74c4bb42ef6e1c7786
    restart: unless-stopped
    environment:
      # Ohne Einrichtungscode: Er stünde nur im Protokoll des Containers.
      DMS_EINRICHTUNGSCODE: "aus"
    ports:
      - target: 3000
        published: "8478"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/files
        target: /data/files
      - type: bind
        source: /DATA/AppData/$AppID/geheim
        target: /data/geheim
      - type: bind
        source: /DATA/AppData/$AppID/sicherung
        target: /data/sicherung
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /data/postgres

x-casaos:
  id: io.github.motom001.dms
  main: dms
  index: /
  port_map: "8478"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/motom001/dms-appstore@gh-pages/apps/io.github.motom001.dms/assets/icon.png
  title:
    en_US: DMS
    de_DE: DMS
  version: "0.138.0"
